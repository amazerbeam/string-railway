<style>

    height: 100dvh;
    width: 100%;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:

      'table'

  /* ---------- status band ---------- */

  .status {

<script>
  // ---------------------------------------------------------------------------
  // Mockup only. Mirrors src/warCouncil/'s rules closely enough to be honest
  // about how the surface behaves; the real build calls the engine instead.
  // ---------------------------------------------------------------------------

  const SUITS = ['bells', 'keys', 'moons']
  const SUIT_LABEL = { bells: 'Bells', keys: 'Keys', moons: 'Moons' }
  const RANK_NAME = { 1: 'Swan', 3: 'Fox', 5: 'Woodcutter', 9: 'Witch', 11: 'Monarch' }
  const PLAYER = 'player'
  const CPU = 'cpu'

  let seed = 20260805
  function rng() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff
    return seed / 0x7fffffff
  }

  const k = (c) => c.suit + '-' + c.rank
  const same = (a, b) => a.suit === b.suit && a.rank === b.rank
  const other = (s) => (s === PLAYER ? CPU : PLAYER)
  const ofSuit = (hand, suit) => hand.filter((c) => c.suit === suit)
  const lowest = (cards) =>
    cards.reduce((lo, c) => (!lo || c.rank < lo.rank ? c : lo), null)
  const highest = (cards) =>
    cards.reduce((hi, c) => (!hi || c.rank > hi.rank ? c : hi), null)

  function cardName(c) {
    const base = c.rank + ' of ' + SUIT_LABEL[c.suit]
    return RANK_NAME[c.rank] ? base + ' (' + RANK_NAME[c.rank] + ')' : base
  }

  let S

  function deal() {
    const deck = []
    for (let r = 1; r <= 11; r++) for (const s of SUITS) deck.push({ suit: s, rank: r })
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1))
      ;[deck[i], deck[j]] = [deck[j], deck[i]]
    }
    const decree = deck[26]
    S = {
      hands: { player: deck.slice(0, 13), cpu: deck.slice(13, 26) },
      drawPile: deck.slice(27, 33),
      decree,
      trumpSuit: decree.suit,
      tricksWon: { player: 0, cpu: 0 },
      tricksPlayed: 0,
      trick: [],
      leader: CPU,
      resolved: null,
      armed: null,
      prompt: null,
      reject: null,
      fault: null,
      done: false,
    }
    if (S.leader === CPU) cpuTurn()
  }

  function turn() {
    return S.trick.length === 0 ? S.leader : other(S.trick[0].side)
  }

  // Legality — the same three cases the engine's legalMoves covers.
  function legal(side) {
    const hand = S.hands[side]
    if (S.trick.length === 0) return hand
    const led = S.trick[0].card
    if (led.rank === 11) {
      const suited = ofSuit(hand, led.suit)
      if (!suited.length) return hand
      const swan = suited.find((c) => c.rank === 1)
      const hi = highest(suited)
      const out = [swan, hi].filter(Boolean)
      return out.filter((c, i) => out.findIndex((o) => same(o, c)) === i)
    }
    const follow = ofSuit(hand, led.suit)
    return follow.length ? follow : hand
  }

  // A lone rank-9 counts as trump; two neutralise each other.
  function isTrump(card, trick, trumpSuit) {
    if (card.suit === trumpSuit) return true
    if (card.rank !== 9) return false
    return trick.filter((t) => t.card.rank === 9).length === 1
  }

  function trickWinner(pair, trumpSuit) {
    const [lead, follow] = pair
    const lt = isTrump(lead.card, pair, trumpSuit)
    const ft = isTrump(follow.card, pair, trumpSuit)
    if (lt || ft) {
      if (lt && ft) return lead.card.rank > follow.card.rank ? lead.side : follow.side
      return lt ? lead.side : follow.side
    }
    if (follow.card.suit !== lead.card.suit) return lead.side
    return lead.card.rank > follow.card.rank ? lead.side : follow.side
  }

  // Swan: a Swan on the losing side takes the lead instead of the winner.
  function nextLeader(pair, winner) {
    const loser = pair.find((t) => t.side !== winner)
    return loser && loser.card.rank === 1 ? loser.side : winner
  }

  function commit(side, card, choice) {
    const hand = S.hands[side]
    const i = hand.findIndex((c) => same(c, card))
    if (i === -1) return
    hand.splice(i, 1)

    if (card.rank === 3 && choice && choice.give) {
      const gi = hand.findIndex((c) => same(c, choice.give))
      if (gi !== -1) {
        const given = hand.splice(gi, 1)[0]
        hand.push(S.decree)
        S.decree = given
        S.trumpSuit = given.suit
      }
    } else if (card.rank === 5 && choice && choice.discard) {
      hand.push(S.drawPile.shift())
      const di = hand.findIndex((c) => same(c, choice.discard))
      if (di !== -1) S.drawPile.push(hand.splice(di, 1)[0])
    }

    S.trick.push({ side, card })

    if (S.trick.length === 2) {
      const pair = S.trick
      const winner = trickWinner(pair, S.trumpSuit)
      S.tricksWon[winner] += 1
      S.tricksPlayed += 1
      S.resolved = { pair, winner }
      S.leader = nextLeader(pair, winner)
      S.trick = []
      if (S.tricksPlayed === 13) S.done = true
    }
  }

  function cpuMove() {
    const options = legal(CPU)
    if (!options.length) return null
    if (S.trick.length === 0) return lowest(options)
    const winners = options.filter(
      (c) => trickWinner([S.trick[0], { side: CPU, card: c }], S.trumpSuit) === CPU,
    )
    return winners.length ? lowest(winners) : lowest(options)
  }

  function cpuChoice(card) {
    const hand = S.hands[CPU].filter((c) => !same(c, card))
    if (card.rank === 3) {
      const counts = {}
      for (const c of hand) counts[c.suit] = (counts[c.suit] || 0) + 1
      const best = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0]
      if (!best || best === S.trumpSuit) return null
      return { give: lowest(ofSuit(hand, best)) }
    }
    if (card.rank === 5) {
      const withDrawn = hand.concat([S.drawPile[0]])
      return { discard: lowest(withDrawn) }
    }
    return null
  }

  function cpuTurn() {
    if (S.done || turn() !== CPU) return
    const card = cpuMove()
    if (!card) return
    commit(CPU, card, cpuChoice(card))
  }

  // --------------------------------- render ---------------------------------

  const statusEl = document.getElementById('status')
  const tableEl = document.getElementById('table')
  const handEl = document.getElementById('hand')

  function suitSvg(suit, cls) {
    return '<svg class="' + cls + '" aria-hidden="true"><use href="#s-' + suit + '"/></svg>'
  }

  function cardEl(card, opts) {
    const o = opts || {}
    const cls = ['card', 'suit-' + card.suit]
    if (o.played) cls.push('is-played')
    if (o.plate) cls.push('is-plate')
    if (o.illegal) cls.push('is-illegal')
    if (o.armed) cls.push('is-armed')
    if (o.winner) cls.push('is-winner')

    const attrs = [
      'type="button"',
      'class="' + cls.join(' ') + '"',
      'aria-label="' + cardName(card) + '"',
    ]
    if (o.played || o.plate) attrs.push('disabled', 'tabindex="-1"')
    if (o.illegal) attrs.push('disabled')
    if (o.action) attrs.push('data-act="' + o.action + '"', 'data-card="' + k(card) + '"')
    if (o.armed) attrs.push('aria-pressed="true"')
    if (o.style) attrs.push('style="' + o.style + '"')

    return (
      '<button ' +
      attrs.join(' ') +
      '><span class="card-rank">' +
      card.rank +
      '</span>' +
      suitSvg(card.suit, 'card-suit') +
      '<span class="card-pip' +
      (RANK_NAME[card.rank] ? '' : ' is-blank') +
      '"></span></button>'
    )
  }

  function pileMarkup() {
    return (
      '<div class="pile"><span class="plate-label">Decree</span>' +
      '<span class="pile-cards">' +
      '<span class="pile-back b1" aria-hidden="true"></span>' +
      '<span class="pile-back b2" aria-hidden="true"></span>' +
      cardEl(S.decree, { plate: true }) +
      '</span>' +
      '<span class="trump-mark">' +
      suitSvg(S.trumpSuit, '') +
      SUIT_LABEL[S.trumpSuit] +
      ' is trump</span>' +
      '<span class="plate-label">' +
      S.drawPile.length +
      ' in the pile</span></div>'
    )
  }

  function renderStatus() {
    const backs = Array.from({ length: Math.min(S.hands.cpu.length, 8) })
      .map(() => '<span class="stack-back"></span>')
      .join('')
    const pl = S.tricksWon.player
    const cp = S.tricksWon.cpu

    statusEl.innerHTML =
      '<div class="plate"><span class="plate-label">Opponent</span>' +
      '<span class="stack" aria-hidden="true">' +
      backs +
      '</span>' +
      '<span class="plate-label">' +
      S.hands.cpu.length +
      ' held</span></div>' +
      '<div class="score" role="group" aria-label="Tricks won">' +
      '<span class="score-cell' +
      (pl > cp ? ' is-lead' : '') +
      '"><span class="score-side">You</span><span class="score-value">' +
      pl +
      '</span></span>' +
      '<span class="score-cell"><span class="score-side">Trick</span><span class="score-value">' +
      Math.min(S.tricksPlayed + (S.done ? 0 : 1), 13) +
      '</span></span>' +
      '<span class="score-cell' +
      (cp > pl ? ' is-lead' : '') +
      '"><span class="score-side">Them</span><span class="score-value">' +
      cp +
      '</span></span>' +
      '</div>'
  }

  function points(t) {
    if (t <= 3) return 6
    if (t === 4) return 1
    if (t === 5) return 2
    if (t === 6) return 3
    if (t <= 9) return 6
    return 0
  }

  function renderTable() {
    tableEl.classList.toggle('is-waiting', Boolean(S.resolved) && !S.fault)
    let inner = ''

    if (S.fault) {
      inner =
        '<p class="fault" role="alert">The engine rejected the opponent’s own move — reason: ' +
        S.fault +
        '. That is a bug, not a rule, so play stops here rather than retrying.</p>'
    } else if (S.done && S.resolved) {
      inner =
        '<div class="over"><h2>Round complete</h2>' +
        '<table class="tally"><thead><tr><th>Side</th><th>Tricks</th><th>Points</th></tr></thead><tbody>' +
        '<tr><td>You</td><td>' +
        S.tricksWon.player +
        '</td><td>' +
        points(S.tricksWon.player) +
        '</td></tr><tr><td>Opponent</td><td>' +
        S.tricksWon.cpu +
        '</td><td>' +
        points(S.tricksWon.cpu) +
        '</td></tr></tbody></table>' +
        '<p class="table-hint">Reports the round and hands back to the battle</p></div>'
    } else if (S.prompt) {
      inner = renderPrompt()
    } else if (S.resolved) {
      const { pair, winner } = S.resolved
      inner =
        '<div class="trick-row">' +
        pair
          .map(
            (t) =>
              '<span class="played' +
              (t.side === winner ? ' is-winner' : '') +
              '"><span class="played-side">' +
              (t.side === PLAYER ? 'You' : 'Them') +
              '</span>' +
              cardEl(t.card, { played: true, winner: t.side === winner }) +
              '</span>',
          )
          .join('') +
        '</div><p class="table-line">' +
        (winner === PLAYER ? 'You take the trick.' : 'They take the trick.') +
        '</p><p class="table-hint">Tap the table to carry on</p>'
    } else if (S.trick.length) {
      inner =
        '<div class="trick-row"><span class="played"><span class="played-side">Them</span>' +
        cardEl(S.trick[0].card, { played: true }) +
        '</span></div><p class="table-line">They led ' +
        cardName(S.trick[0].card) +
        '.</p>'
    } else {
      inner = '<div class="trick-row"></div><p class="table-line">The table is yours — lead.</p>'
    }

    tableEl.innerHTML = pileMarkup() + '<div class="table-inner">' + inner + '</div>'
  }

  function renderPrompt() {
    const p = S.prompt
    const rest = S.hands.player.filter((c) => !same(c, p.card))

    if (p.card.rank === 3) {
      return (
        '<div class="prompt"><p class="table-line">Give a card to become the decree, and take ' +
        cardName(S.decree) +
        ' back. This changes trump before the trick resolves.</p><div class="prompt-row">' +
        rest.map((c) => cardEl(c, { action: 'give' })).join('') +
        '<button type="button" class="decline" data-act="decline">Keep the decree</button>' +
        '</div><p class="table-hint">Choose one, or decline</p></div>'
      )
    }

    return (
      '<div class="prompt"><p class="table-line">You drew ' +
      cardName(S.drawPile[0]) +
      '. Put one card back on the pile.</p><div class="prompt-row">' +
      '<span class="drawn-wrap"><span class="drawn-tag">Drawn</span>' +
      cardEl(S.drawPile[0], { action: 'discard' }) +
      '</span>' +
      rest.map((c) => cardEl(c, { action: 'discard' })).join('') +
      '</div><p class="table-hint">Choose one to discard</p></div>'
    )
  }

  function renderHand() {
    if (S.done) {
      handEl.innerHTML = ''
      return
    }

    const myTurn = turn() === PLAYER && !S.resolved && !S.prompt && !S.fault
    const ok = myTurn ? legal(PLAYER).map(k) : []
    const hand = S.hands.player
    const n = hand.length

    let hint = ''
    let hintCls = 'hand-hint'
    if (S.reject) {
      hint = S.reject
      hintCls += ' is-reject'
    } else if (S.prompt) {
      hint = 'Choose what the card does'
    } else if (S.resolved) {
      hint = 'Trick resolved'
    } else if (S.armed) {
      hint = 'Tap ' + cardName(S.armed) + ' again to play it'
      hintCls += ' is-live'
    } else if (myTurn) {
      hint = S.trick.length ? 'Follow their lead' : 'Your lead'
    }

    const cards = hand
      .map((c, i) => {
        const spread = n > 1 ? i - (n - 1) / 2 : 0
        const rot = spread * 2.1
        const lift = Math.pow(Math.abs(spread), 2) * 0.13
        const overlap = n > 9 ? -18 : n > 6 ? -10 : -4
        const armed = S.armed && same(S.armed, c)
        const style =
          '--fan-rot: rotate(' +
          rot.toFixed(2) +
          'deg); transform: translateY(' +
          lift.toFixed(2) +
          '%) rotate(' +
          rot.toFixed(2) +
          'deg); margin-left: ' +
          (i === 0 ? 0 : overlap) +
          'px; z-index: ' +
          (armed ? 20 : i)
        return cardEl(c, {
          action: 'select',
          illegal: !myTurn || ok.indexOf(k(c)) === -1,
          armed: Boolean(armed),
          style,
        })
      })
      .join('')

    handEl.innerHTML =
      '<p class="' + hintCls + '">' + hint + '</p><div class="fan" role="group" aria-label="Your hand">' + cards + '</div>'
  }

  function render() {
    renderStatus()
    renderTable()
    renderHand()
  }

  // ------------------------------ interaction ------------------------------

  function findCard(list, id) {
    return list.find((c) => k(c) === id) || null
  }

  function play(card, choice) {
    commit(PLAYER, card, choice)
    S.armed = null
    S.prompt = null
    S.reject = null
    if (!S.resolved) cpuTurn()
    render()
  }

  function carryOn() {
    if (!S.resolved || S.done) return
    S.resolved = null
    cpuTurn()
    render()
  }

  document.addEventListener('click', (event) => {
    const dev = event.target.closest('[data-dev]')
    if (dev) return handleDev(dev.dataset.dev)

    const el = event.target.closest('[data-act]')

    if (!el) {
      if (event.target.closest('#table') && S.resolved && !S.done) carryOn()
      return
    }

    const act = el.dataset.act

    if (act === 'select') {
      const card = findCard(S.hands.player, el.dataset.card)
      if (!card) return
      S.reject = null
      // Tap once to arm, tap the same card again to play it.
      if (S.armed && same(S.armed, card)) {
        if (card.rank === 3 || card.rank === 5) {
          S.prompt = { card }
          S.armed = null
          render()
          return
        }
        play(card)
        return
      }
      S.armed = card
      render()
      return
    }

    if (act === 'give') {
      const give = findCard(S.hands.player, el.dataset.card)
      play(S.prompt.card, { give })
      return
    }

    if (act === 'discard') {
      const pool = S.hands.player.concat([S.drawPile[0]])
      const discard = findCard(pool, el.dataset.card)
      play(S.prompt.card, { discard })
      return
    }

    if (act === 'decline') {
      play(S.prompt.card, null)
      return
    }
  })

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && S.armed) {
      S.armed = null
      render()
      return
    }
    if (event.key === 'Enter' && S.resolved && !S.done) carryOn()
  })

  function handleDev(what) {
    if (what === 'hide') {
      document.getElementById('devbar').hidden = true
      document.getElementById('devdot').hidden = false
      return
    }
    if (what === 'deal') {
      deal()
      render()
      return
    }
    if (what === 'fox') {
      // Put a Fox and a Woodcutter in hand so both prompts are reachable.
      for (const rank of [3, 5]) {
        if (!S.hands.player.some((c) => c.rank === rank)) {
          S.hands.player[S.hands.player.length - (rank === 3 ? 1 : 2)] = {
            suit: S.trumpSuit === 'bells' ? 'keys' : 'bells',
            rank,
          }
        }
      }
      S.trick = []
      S.resolved = null
      S.leader = PLAYER
      S.armed = null
      render()
      return
    }
    if (what === 'end') {
      S.tricksPlayed = 12
      S.hands.player = S.hands.player.slice(0, 1)
      S.hands.cpu = S.hands.cpu.slice(0, 1)
      S.trick = []
      S.resolved = null
      S.armed = null
      S.leader = PLAYER
      render()
      return
    }
    if (what === 'fault') {
      S.fault = 'notYourTurn'
      render()
    }
  }

  document.getElementById('devdot').addEventListener('click', () => {
    document.getElementById('devbar').hidden = false
    document.getElementById('devdot').hidden = true
  })

  deal()
  render()
</script>
