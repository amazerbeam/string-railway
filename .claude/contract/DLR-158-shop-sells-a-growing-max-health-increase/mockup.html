<title>Max Health Shelf</title>
<style>
  :root {
    --ink: #f2e8d5;
    --ink-dim: #a99a80;
    --ground: #1a1613;
    --panel: #262019;
    --panel-edge: #3d3327;
    --coin: #d8a93f;
    --heart: #c4453a;
    --heart-out: #4a3a33;
    --brass: #b98f3c;
    --accent: #6f9c6a;
    --pad: clamp(0.5rem, 1.4vh, 1rem);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.4 "Iowan Old Style", Georgia, serif;
  }

  /* The shell: one full-viewport grid, svh not vh, no page scroll. */
  .shop-shell {
    height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: var(--pad);
    padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad)
             calc(var(--pad) + env(safe-area-inset-bottom));
    overflow: hidden;
  }

  /* Zone 1 — status, anchored to the top edge. */
  .shop-status {
    display: flex;
    align-items: center;
    gap: clamp(1rem, 4vw, 3rem);
    flex-wrap: wrap;
    padding: 0 0.4rem;
  }
  .shop-stat { display: flex; align-items: baseline; gap: 0.5rem; }
  .shop-stat-value { font-size: clamp(1.2rem, 3vh, 1.9rem); font-variant-numeric: tabular-nums; }
  .is-coins { color: var(--coin); }
  .shop-stat-label { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
  .shop-hearts { display: flex; gap: 2px; flex-wrap: wrap; max-width: 40vw; }
  .shop-heart { width: 13px; height: 13px; border-radius: 3px 3px 6px 6px; background: var(--heart); }
  .shop-heart[data-state="broken"] { background: transparent; border: 1px solid var(--heart-out); }
  /* A heart gained this purchase reads as gained without relying on colour alone. */
  .shop-heart[data-state="gained"] { background: var(--heart); outline: 2px solid var(--brass); outline-offset: 1px; }
  .shop-next { margin-left: auto; text-align: right; font-size: 0.85rem; color: var(--ink-dim); }
  .shop-next b { display: block; color: var(--ink); font-size: 1rem; }

  /* Zone 2 — the machine, centre stage. A flat stand-in here: this mockup is about the shelf. */
  .shop-stage {
    display: grid;
    place-items: center;
    border: 1px dashed var(--panel-edge);
    border-radius: 10px;
    color: var(--ink-dim);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    min-height: 0;
  }

  /* Zone 3 — the tray. */
  .shop-tray { display: grid; gap: var(--pad); }
  .shop-held {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    padding: 0.5rem 0.7rem;
    font-size: 0.85rem;
    color: var(--ink-dim);
  }
  .shop-buys { display: flex; gap: 0.6rem; align-items: flex-start; flex-wrap: wrap; }
  .shop-buy-slot { display: grid; gap: 0.25rem; flex: 1 1 9.5rem; min-width: 8.5rem; }

  .shop-buy {
    min-height: 56px;                 /* >= 44px target */
    touch-action: manipulation;
    display: grid;
    gap: 0.15rem;
    padding: 0.55rem 0.7rem;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-edge);
    border-left: 3px solid var(--brass);
    border-radius: 8px;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .shop-buy.is-flask { border-left-color: var(--accent); }
  .shop-buy:focus-visible { outline: 2px solid var(--coin); outline-offset: 2px; }
  @media (hover: hover) { .shop-buy:hover:not(:disabled) { background: #2f2820; } }
  .shop-buy:active:not(:disabled) { transform: translateY(1px); }
  .shop-buy:disabled { opacity: 0.45; cursor: not-allowed; border-left-style: dashed; }
  .shop-buy-name { font-size: 1.02rem; }
  .shop-buy-price { font-size: 0.85rem; color: var(--coin); font-variant-numeric: tabular-nums; }
  .shop-buy-price.is-free { color: var(--ink-dim); }
  /* The price change is announced in text, not only by the numeral quietly changing. */
  .shop-buy-price .climb { color: var(--ink-dim); font-size: 0.78rem; }
  .shop-refusal { margin: 0; font-size: 0.78rem; color: var(--ink-dim); }
  .shop-leave {
    min-height: 56px;
    touch-action: manipulation;
    flex: 0 0 auto;
    padding: 0.55rem 1rem;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    font: inherit;
    cursor: pointer;
  }
  .shop-leave:focus-visible { outline: 2px solid var(--coin); outline-offset: 2px; }

  .note {
    position: fixed;
    top: 0; right: 0;
    padding: 0.3rem 0.6rem;
    background: #000a;
    color: var(--ink-dim);
    font: 11px/1.3 ui-monospace, monospace;
    border-bottom-left-radius: 6px;
  }
</style>

<div class="note">MOCKUP — fake data, DLR-158</div>

<div class="shop-shell">
  <header class="shop-status" role="group" aria-label="Your purse and health">
    <span class="shop-stat">
      <span class="shop-stat-value is-coins" id="coins">12</span>
      <span class="shop-stat-label">Coins</span>
    </span>

    <span class="shop-stat" role="meter" id="meter"
          aria-valuenow="4" aria-valuemin="0" aria-valuemax="10"
          aria-label="Health 4 of 10">
      <span class="shop-hearts" id="hearts" aria-hidden="true"></span>
      <span class="shop-stat-value" id="healthText">4 / 10</span>
      <span class="shop-stat-label">Health</span>
    </span>

    <span class="shop-next"><b>Aoife</b>Fight 2 of 5</span>
  </header>

  <main class="shop-stage">The slot machine sits here</main>

  <footer class="shop-tray">
    <div class="shop-held">What you hold — 3 cards (Taker · Feeder · Sidestep)</div>

    <div class="shop-buys">
      <div class="shop-buy-slot">
        <button type="button" class="shop-buy" id="healBtn" onclick="buyHeal()"
                aria-label="Heal — 1 coin">
          <span class="shop-buy-name">Heal</span>
          <span class="shop-buy-price" id="healPrice">1 coin</span>
        </button>
        <p class="shop-refusal" role="status" id="healRefusal" hidden></p>
      </div>

      <!-- DLR-158 — the new tile. Same shape as Heal's; the price is the NEXT purchase's. -->
      <div class="shop-buy-slot">
        <button type="button" class="shop-buy" id="maxBtn" onclick="buyMaxHealth()"
                aria-label="Max health — 3 coins">
          <span class="shop-buy-name">Max health</span>
          <span class="shop-buy-price" id="maxPrice">3 coins</span>
        </button>
        <p class="shop-refusal" role="status" id="maxRefusal" hidden></p>
      </div>

      <div class="shop-buy-slot" role="group" aria-label="Your flask">
        <button type="button" class="shop-buy is-flask" id="flaskBtn" onclick="drinkFlask()"
                aria-label="Drink the flask — Free — 1 charge, restores 6">
          <span class="shop-buy-name">Drink the flask</span>
          <span class="shop-buy-price is-free" id="flaskPrice">No coin · 1 charge</span>
        </button>
        <p class="shop-refusal" role="status" id="flaskRefusal" hidden></p>
      </div>

      <button type="button" class="shop-leave" onclick="leave()">Fight Aoife</button>
    </div>
  </footer>
</div>

<script>
  // ── Fake run state. Placeholder tuning values, exactly as plan.md marks them. ──
  const HEAL_PRICE = 1;
  const HEAL_HEALTH_RESTORED = 4;
  const FLASK_HEAL_PERCENT = 0.6;
  const MAX_HEALTH_PRICE_BASE = 3;   // VALUE UNCHOSEN — developer's
  const MAX_HEALTH_PRICE_STEP = 2;   // VALUE UNCHOSEN — developer's
  const MAX_HEALTH_PER_PURCHASE = 2; // VALUE UNCHOSEN — developer's

  const run = {
    coins: 12,
    health: 4,
    maxPlayerHealth: 10,
    maxHealthPurchases: 0,
    flaskCharges: 1,
    justGained: 0, // hearts added by the last purchase, for the "gained" marker
  };

  // The single price formula — the mockup's stand-in for maxHealthPriceFor().
  const maxHealthPrice = () =>
    MAX_HEALTH_PRICE_BASE + MAX_HEALTH_PRICE_STEP * run.maxHealthPurchases;

  const coinWord = (n) => `${n} coin${n === 1 ? '' : 's'}`;

  function buyHeal() {
    if (run.coins < HEAL_PRICE || run.health >= run.maxPlayerHealth) return;
    run.coins -= HEAL_PRICE;
    run.health = Math.min(run.maxPlayerHealth, run.health + HEAL_HEALTH_RESTORED);
    run.justGained = 0;
    render();
  }

  // AC1/AC2 — raise the ceiling, then fill to the NEW top regardless of how hurt you were.
  function buyMaxHealth() {
    const price = maxHealthPrice();
    if (run.coins < price) return;
    run.coins -= price;
    run.justGained = MAX_HEALTH_PER_PURCHASE;
    run.maxPlayerHealth += MAX_HEALTH_PER_PURCHASE;
    run.health = run.maxPlayerHealth;
    run.maxHealthPurchases += 1;
    render();
  }

  function drinkFlask() {
    if (run.flaskCharges <= 0 || run.health >= run.maxPlayerHealth) return;
    run.flaskCharges -= 1;
    run.health = Math.min(
      run.maxPlayerHealth,
      run.health + Math.round(run.maxPlayerHealth * FLASK_HEAL_PERCENT),
    );
    run.justGained = 0;
    render();
  }

  function leave() {
    // Stubbed — the real screen unmounts the shop and starts the next fight.
    document.querySelector('.note').textContent = 'MOCKUP — leaving for the fight (stub)';
  }

  function render() {
    document.getElementById('coins').textContent = run.coins;

    // Hearts: whole, broken, and — for the two just bought — whole with a brass outline, so the
    // gain reads in form as well as position and survives a greyscale screenshot.
    const hearts = document.getElementById('hearts');
    hearts.replaceChildren();
    for (let i = 0; i < run.maxPlayerHealth; i++) {
      const pip = document.createElement('span');
      pip.className = 'shop-heart';
      const gained = i >= run.maxPlayerHealth - run.justGained;
      pip.dataset.state = i < run.health ? (gained ? 'gained' : 'whole') : 'broken';
      hearts.appendChild(pip);
    }
    document.getElementById('healthText').textContent = `${run.health} / ${run.maxPlayerHealth}`;
    const meter = document.getElementById('meter');
    meter.setAttribute('aria-valuenow', run.health);
    meter.setAttribute('aria-valuemax', run.maxPlayerHealth);
    meter.setAttribute('aria-label', `Health ${run.health} of ${run.maxPlayerHealth}`);

    // Heal — refused at full health, and when the coins are short.
    const healBtn = document.getElementById('healBtn');
    const healRefusal = document.getElementById('healRefusal');
    const healReason =
      run.health >= run.maxPlayerHealth ? 'You are already at full health.'
      : run.coins < HEAL_PRICE ? 'You do not have the coins for this.'
      : null;
    document.getElementById('healPrice').textContent = coinWord(HEAL_PRICE);
    healBtn.disabled = healReason !== null;
    healBtn.setAttribute('aria-label',
      `Heal — ${coinWord(HEAL_PRICE)}${healReason ? ' — ' + healReason : ''}`);
    healRefusal.hidden = healReason === null;
    healRefusal.textContent = healReason ?? '';

    // AC5/AC6 — the NEXT purchase's price, updated in place. Full health never refuses it;
    // short coins is the only reason there is.
    const price = maxHealthPrice();
    const maxBtn = document.getElementById('maxBtn');
    const maxRefusal = document.getElementById('maxRefusal');
    const maxReason = run.coins < price ? 'You do not have the coins for this.' : null;
    document.getElementById('maxPrice').innerHTML =
      `${coinWord(price)}${run.maxHealthPurchases > 0
        ? ` <span class="climb">· next ${coinWord(price + MAX_HEALTH_PRICE_STEP)}</span>` : ''}`;
    maxBtn.disabled = maxReason !== null;
    maxBtn.setAttribute('aria-label',
      `Max health — ${coinWord(price)}${maxReason ? ' — ' + maxReason : ''}`);
    maxRefusal.hidden = maxReason === null;
    maxRefusal.textContent = maxReason ?? '';

    // Flask — free, charge-limited, and its heal scales with the raised ceiling.
    const flaskBtn = document.getElementById('flaskBtn');
    const flaskRefusal = document.getElementById('flaskRefusal');
    const flaskReason =
      run.flaskCharges <= 0 ? 'Your flask is empty. Beat a stage boss to refill it.'
      : run.health >= run.maxPlayerHealth ? 'You are already at full health.'
      : null;
    const flaskHeal = Math.round(run.maxPlayerHealth * FLASK_HEAL_PERCENT);
    document.getElementById('flaskPrice').textContent =
      `No coin · ${run.flaskCharges} charge${run.flaskCharges === 1 ? '' : 's'}`;
    flaskBtn.disabled = flaskReason !== null;
    flaskBtn.setAttribute('aria-label',
      `Drink the flask — Free — ${run.flaskCharges} charge${run.flaskCharges === 1 ? '' : 's'}, restores ${flaskHeal}${flaskReason ? ' — ' + flaskReason : ''}`);
    flaskRefusal.hidden = flaskReason === null;
    flaskRefusal.textContent = flaskReason ?? '';
  }

  render();
</script>
